<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #cfe9f8;
  color: #0f172a;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  text-align: center;
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

/* CLOCK */
.clock {
  font-size: 88px;
  font-weight: 600;
}

/* USER */
.user {
  margin-top: 8px;
  font-size: 18px;
}

#username {
  cursor: pointer;
}

#username:focus {
  outline: none;
  border-bottom: 1px dashed #0f172a;
}

/* SEARCH */
.search {
  display: flex;
  margin-top: 30px;
}

.search input {
  flex: 1;
  padding: 16px;
  border-radius: 30px;
  border: none;
  font-size: 16px;
  outline: none;
}

.search button {
  margin-left: 10px;
  padding: 16px 24px;
  border-radius: 30px;
  border: none;
  background: #1d9bf0;
  color: white;
  font-size: 16px;
}

/* ARABIC AYAH */
.ayah {
  margin-top: 26px;
  font-size: 18px;
  line-height: 2;
  font-family: "Amiri", "Scheherazade New", serif;
  direction: rtl;
  opacity: 0.9;
}

.ayah small {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  opacity: 0.6;
  direction: ltr;
}

/* SHORTCUTS */
.shortcuts {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 38px;
}

.shortcuts a {
  width: 52px;
  height: 52px;
  background: #1d9bf0;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  text-decoration: none;
  font-size: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="clock" id="clock">00:00</div>

  <div class="user">
    <span id="username" onclick="editName()">Touch to edit...</span><br>
    <small id="date"></small>
  </div>

  <form class="search" onsubmit="doSearch(event)">
    <input type="text" id="query" placeholder="Type here…" autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>

  <div class="ayah" id="ayah">
    جاري تحميل الآية…
  </div>

  <div class="shortcuts">
    <a href="https://youtube.com">▶</a>
    <a href="https://instagram.com">◎</a>
    <a href="https://mail.google.com">✉</a>
    <a href="https://web.telegram.org">✈</a>
  </div>

</div>

<script>
/* TIME */
function updateTime() {
  const now = new Date();
  document.getElementById("clock").innerText =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  document.getElementById("date").innerText =
    now.toDateString();
}
setInterval(updateTime, 1000);
updateTime();

/* SEARCH */
function doSearch(e) {
  e.preventDefault();
  const q = document.getElementById("query").value.trim();
  if (q !== "") {
    window.location.href =
      "https://www.google.com/search?q=" + encodeURIComponent(q);
  }
}

/* EDITABLE NAME */
const nameEl = document.getElementById("username");

function loadName() {
  const savedName = localStorage.getItem("username");
  if (savedName) nameEl.innerText = savedName;
}

function editName() {
  nameEl.contentEditable = "true";
  nameEl.focus();
}

nameEl.addEventListener("blur", () => {
  nameEl.contentEditable = "false";
  localStorage.setItem("username", nameEl.innerText.trim());
});

loadName();

/* RANDOM ARABIC AYAH */
fetch("https://api.alquran.cloud/v1/ayah/random")
  .then(res => res.json())
  .then(data => {
    const a = data.data;
    document.getElementById("ayah").innerHTML =
      `${a.text}<small>— سورة ${a.surah.name} · آية ${a.numberInSurah}</small>`;
  })
  .catch(() => {
    document.getElementById("ayah").innerText = "";
  });
</script>

</body>
</html>
